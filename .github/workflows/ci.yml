name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUST_BACKTRACE: 1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lockfile:
    name: lockfile consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate committed lockfile
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- Cargo.lock

  x11-contract:
    name: X11-only product contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Enforce pivot workspace
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/benchmark-x11-session.sh
          bash -n scripts/run-resolution-qa.sh
          bash -n scripts/run-settings-service-qa.sh
          bash -n scripts/slopos-recovery.sh
          bash -n packaging/vm/qa-vm.sh packaging/vm/arch-install.sh
          test ! -d crates/slopos-compositor
          ! grep -Eq 'slopos-compositor|smithay|wayland-client|wayland-server' Cargo.toml
          grep -Fq 'crates/slopos-session' Cargo.toml
          grep -Fq 'crates/slopos-shell' Cargo.toml
          grep -Fq 'crates/slopos-catalogue' Cargo.toml
          grep -Fq 'crates/slopos-settings' Cargo.toml
          shipping_files=(
            install.sh
            scripts/start-slopos-i
            scripts/install-session-files.sh
            packaging/slopos-i.desktop
            packaging/arch/PKGBUILD
            packaging/debian/changelog
            packaging/debian/control
            packaging/debian/rules
            packaging/iso/build-iso.sh
            packaging/iso/packages.x86_64
            packaging/deps/arch.txt
            packaging/deps/ubuntu.txt
            packaging/deps/arch-build.txt
            packaging/deps/ubuntu-build.txt
            packaging/vm/arch-install.sh
          )
          for path in "${shipping_files[@]}"; do
            test -f "$path"
            ! grep -Eiq '(^|[^[:alnum:]])(wayland|smithay|wlroots|xwayland|slopos-compositor)([^[:alnum:]]|$)' "$path"
          done
          for path in install.sh packaging/arch/PKGBUILD packaging/debian/rules packaging/iso/build-iso.sh; do
            for binary in slopos-session slopos-shell slopos-catalogue slopos-settings; do
              grep -Fq "$binary" "$path"
            done
          done
          grep -Fq 'assets/slopos-logo.png' install.sh
          grep -Fqx 'xorg-xrandr' packaging/deps/arch.txt
          for path in packaging/arch/PKGBUILD packaging/debian/rules packaging/iso/build-iso.sh; do
            grep -Fq 'share/xsessions/slopos-i.desktop' "$path"
            grep -Fq 'assets/config/openbox/rc.xml' "$path"
            grep -Fq 'themes/slopos-openbox/openbox-3/themerc' "$path"
            grep -Fq 'assets/config/gtk-3.0/gtk.css' "$path"
            grep -Fq 'assets/slopos-logo.png' "$path"
          done
          grep -Fq 'assets/config/mimeapps.list' packaging/iso/build-iso.sh
          test -f packaging/vm/qa-installed.ps1
          grep -Fq 'shipping_files=(' packaging/vm/qa-vm.sh
          grep -Fq 'REPO_COMMIT="${REPO_COMMIT:-}"' packaging/vm/arch-install.sh
          grep -Fq 'git -C ~/slopos-i checkout --detach' packaging/vm/arch-install.sh
          grep -Fq 'xorg-xrandr' packaging/vm/arch-install.sh
          grep -Fq 'partition_path()' packaging/vm/arch-install.sh
          grep -Fq 'grub-install --target=x86_64-efi' packaging/vm/arch-install.sh
          grep -Fq -- '--firmware efi' packaging/vm/create-vm.ps1
          grep -Fq 'command -v xrandr' packaging/vm/qa-vm.sh
          grep -Fq '/sys/firmware/efi' packaging/vm/qa-vm.sh
          grep -Fq 'EFI_BOOT_STATUS_0=' packaging/vm/qa-vm.sh
          grep -Fq 'X11_ACTIVE_REFRESH_HZ=' packaging/vm/qa-vm.sh
          grep -Fq 'sha256sum -c -' packaging/vm/provision.ps1
          grep -Fq 'bash -n /root/i.sh' packaging/vm/provision.ps1
          grep -Fq 'INSTALLED_VM_QA_STATUS_0' packaging/vm/qa-installed.ps1

  format-evidence:
    name: rustfmt remediation evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate canonical rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt.patch"
          if [ -s "$RUNNER_TEMP/rustfmt.patch" ]; then
            cat "$RUNNER_TEMP/rustfmt.patch"
          else
            echo "Repository is already rustfmt-clean." > "$RUNNER_TEMP/rustfmt.patch"
          fi
      - name: Upload rustfmt evidence
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ env.SOURCE_SHA }}
          retention-days: 2
          path: ${{ runner.temp }}/rustfmt.patch

  linux:
    name: build + test + lint (X11 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install X11/GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libx11-dev libxrandr-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked
      - name: Test workspace
        id: test-workspace
        shell: bash
        run: |
          set +e
          set -o pipefail
          cargo test --workspace --locked -- --nocapture 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              escaped="$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
              echo "::error file=cargo-test.log,line=1,title=Cargo workspace test failure::$escaped"
            done < <(grep -E '^test .* \.\.\. FAILED$|^failures:' "$RUNNER_TEMP/cargo-test.log" | tail -n 20 || true)
          fi
          exit "$status"
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustfmt
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > "$RUNNER_TEMP/rustfmt-check.log" 2>&1
          status="$?"
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              escaped="$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
              echo "::error file=rustfmt-check.log,line=1,title=rustfmt mismatch::$escaped"
            done < <(grep -E '^Diff in |^\+|^-|^@@' "$RUNNER_TEMP/rustfmt-check.log" | head -n 40 || true)
          fi
          exit "$status"
      - name: Upload workspace test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/cargo-test.log

  x11-runtime-smoke:
    name: Xvfb + Openbox behavior and visual smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install runtime/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev xvfb openbox xdotool wmctrl \
            adwaita-icon-theme dbus-x11 x11-utils x11-xserver-utils scrot \
            librsvg2-common fonts-liberation fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug binaries
        run: cargo build --workspace --locked
      - name: Install Openbox theme for smoke session
        run: |
          mkdir -p "$HOME/.themes/slopos-openbox/openbox-3"
          cp -a themes/slopos-openbox/openbox-3/. "$HOME/.themes/slopos-openbox/openbox-3/"
      - name: Run X11 behavior and screenshot smoke
        id: runtime-smoke
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/slopos-runtime"
          export SLOPOS_OPENBOX_CONFIG="$GITHUB_WORKSPACE/assets/config/openbox/rc.xml"
          export SLOPOS_QA_NO_WELCOME=1
          mkdir -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/slopos-qa"
          chmod 700 "$XDG_RUNTIME_DIR"

          cleanup() {
            set +e
            for pid in "${SETTINGS_PID:-}" "${CATALOGUE_PID:-}"; do
              if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
            done
            for pid in "${SETTINGS_PID:-}" "${CATALOGUE_PID:-}"; do
              if [ -n "$pid" ]; then wait "$pid" 2>/dev/null || true; fi
            done
            if [ -n "${SESSION_PID:-}" ]; then
              kill -TERM "$SESSION_PID" 2>/dev/null || true
              wait "$SESSION_PID" 2>/dev/null || true
            fi
            pkill -TERM -x slopos-shell 2>/dev/null || true
            pkill -TERM -x openbox 2>/dev/null || true
            if [ -n "${XVFB_PID:-}" ]; then
              kill -TERM "$XVFB_PID" 2>/dev/null || true
              wait "$XVFB_PID" 2>/dev/null || true
            fi
          }

          diagnostics() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== process table ====="
              ps -ef | grep -E 'Xvfb|openbox|slopos' || true
              echo "===== session log ====="
              cat "$RUNNER_TEMP/slopos-session.log" 2>/dev/null || true
              echo "===== settings log ====="
              cat "$RUNNER_TEMP/slopos-settings.log" 2>/dev/null || true
              echo "===== catalogue log ====="
              cat "$RUNNER_TEMP/slopos-catalogue.log" 2>/dev/null || true
              echo "===== xvfb log ====="
              cat "$RUNNER_TEMP/xvfb.log" 2>/dev/null || true
              echo "===== windows ====="
              wmctrl -l 2>/dev/null || true
              xwininfo -root -tree 2>/dev/null || true
            fi
            cleanup
            exit "$status"
          }
          trap diagnostics EXIT

          wait_for() {
            description=$1
            shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then
                echo "ready: $description"
                return 0
              fi
              sleep 0.25
            done
            echo "timed out: $description" >&2
            return 1
          }

          require_no_application_strip() {
            if xdotool search --onlyvisible --name '^SLOPOS Application Strip$' >/dev/null 2>&1; then
              echo "retired Application Strip unexpectedly visible" >&2
              return 1
            fi
          }

          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          wait_for "X server" xdpyinfo -display :99

          dbus-run-session -- ./target/debug/slopos-session >"$RUNNER_TEMP/slopos-session.log" 2>&1 &
          SESSION_PID=$!
          wait_for "Openbox" pgrep -x openbox
          wait_for "SLOPOS shell" pgrep -x slopos-shell
          wait_for "top bar" xdotool search --onlyvisible --name '^SLOPOS Top Bar$'
          require_no_application_strip
          scrot "$RUNNER_TEMP/slopos-qa/01-desktop.png"

          shell_count_before=$(pgrep -x slopos-shell | wc -l)
          pkill -USR1 -x slopos-shell
          wait_for "Search palette" xdotool search --onlyvisible --name '^SLOPOS Search$'
          shell_count_after=$(pgrep -x slopos-shell | wc -l)
          test "$shell_count_before" -eq 1
          test "$shell_count_after" -eq 1
          scrot "$RUNNER_TEMP/slopos-qa/02-search.png"
          xdotool key Escape

          shell_pid_before=$(pgrep -xo slopos-shell)
          kill "$shell_pid_before"
          shell_pid_after=""
          for _ in $(seq 1 40); do
            shell_pid_after=$(pgrep -xo slopos-shell 2>/dev/null || true)
            if [ -n "$shell_pid_after" ] && [ "$shell_pid_after" != "$shell_pid_before" ]; then break; fi
            sleep 0.25
          done
          test -n "$shell_pid_after"
          test "$shell_pid_after" != "$shell_pid_before"
          wait_for "top bar after shell restart" xdotool search --onlyvisible --name '^SLOPOS Top Bar$'
          require_no_application_strip

          wm_pid_before=$(pgrep -xo openbox)
          kill "$wm_pid_before"
          wm_pid_after=""
          for _ in $(seq 1 40); do
            wm_pid_after=$(pgrep -xo openbox 2>/dev/null || true)
            if [ -n "$wm_pid_after" ] && [ "$wm_pid_after" != "$wm_pid_before" ]; then break; fi
            sleep 0.25
          done
          test -n "$wm_pid_after"
          test "$wm_pid_after" != "$wm_pid_before"
          wait_for "top bar after Openbox restart" xdotool search --onlyvisible --name '^SLOPOS Top Bar$'
          require_no_application_strip

          ./target/debug/slopos-settings >"$RUNNER_TEMP/slopos-settings.log" 2>&1 &
          SETTINGS_PID=$!
          wait_for "System Settings" xdotool search --onlyvisible --name '^System Settings$'
          scrot "$RUNNER_TEMP/slopos-qa/03-settings.png"
          kill -TERM "$SETTINGS_PID" 2>/dev/null || true
          wait "$SETTINGS_PID" 2>/dev/null || true
          SETTINGS_PID=""

          ./target/debug/slopos-catalogue >"$RUNNER_TEMP/slopos-catalogue.log" 2>&1 &
          CATALOGUE_PID=$!
          wait_for "Software Catalogue" xdotool search --onlyvisible --name '^Software Catalogue$'
          scrot "$RUNNER_TEMP/slopos-qa/04-catalogue.png"
          kill -TERM "$CATALOGUE_PID" 2>/dev/null || true
          wait "$CATALOGUE_PID" 2>/dev/null || true
          CATALOGUE_PID=""

          for image in "$RUNNER_TEMP"/slopos-qa/*.png; do
            test -s "$image"
          done
          if grep -q 'falling back to host GTK theme' "$RUNNER_TEMP/slopos-session.log"; then
            echo "SLOPOS GTK theme did not load" >&2
            exit 1
          fi

          trap - EXIT
          cleanup
      - name: Upload runtime visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopos-x11-runtime-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/slopos-qa/*.png
            ${{ runner.temp }}/slopos-session.log
            ${{ runner.temp }}/slopos-settings.log
            ${{ runner.temp }}/slopos-catalogue.log
            ${{ runner.temp }}/xvfb.log

  x11-appmenu-real:
    name: Manual real AppMenu importer evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install cached Docker-QA runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev xvfb openbox pcmanfm xfce4-terminal \
            mousepad ristretto zathura mpv galculator xdotool wmctrl scrot \
            imagemagick x11-utils x11-xserver-utils dbus-x11 librsvg2-common \
            curl ca-certificates adwaita-icon-theme fonts-liberation \
            fonts-dejavu-core libnotify-bin appmenu-gtk3-module \
            appmenu-registrar
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build exact release workspace
        run: cargo build --workspace --release --locked
      - name: Run real exporter/importer click-through
        shell: bash
        run: |
          set -euo pipefail
          sudo -E env "PATH=$PATH" \
            SLOPOS_QA_SKIP_DEPS=1 \
            SLOPOS_QA_SKIP_BUILD=1 \
            SLOPOS_QA_USE_UPSTREAM_APPMENU=1 \
            SLOPOS_QA_REQUIRE_UPSTREAM_APPMENU=1 \
            SLOPOS_QA_REQUIRE_REAL_APPMENU=1 \
            bash scripts/run-docker-qa.sh 2>&1 | tee "$RUNNER_TEMP/appmenu-real.log"
          sudo chown -R "$USER":"$USER" artifacts/qa || true
      - name: Require real AppMenu evidence marker
        run: grep -Fq 'APPMENU_UPSTREAM_IMPORT_STATUS_0' "$RUNNER_TEMP/appmenu-real.log"
      - name: Upload real AppMenu evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopos-appmenu-real-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/qa/session.log
            artifacts/qa/xvfb.log
            artifacts/qa/screenshots/appmenu_*_mousepad_1280x800.png
            ${{ runner.temp }}/appmenu-real.log
            /tmp/slopos-qa-dbusmenu.log
            /tmp/slopos-qa-dbusmenu.events
            /tmp/slopos-qa-upstream-dbusmenu.monitor

  x11-arch-app-matrix:
    name: Manual Arch upstream applications and game evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install release-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev
      - name: Build exact release workspace
        run: cargo build --workspace --release --locked
      - name: Run Arch application/browser/game gate in disposable container
        id: arch-app-qa
        shell: bash
        run: |
          set +e
          set -o pipefail
          mkdir -p artifacts/qa/app-matrix
          docker run --rm --shm-size=2g \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env SOURCE_SHA="$SOURCE_SHA" \
            --env SLOPOS_QA_SKIP_BUILD=1 \
            archlinux:base-devel \
            bash scripts/run-arch-app-qa.sh 2>&1 | tee "$RUNNER_TEMP/arch-app-qa.log"
          status="${PIPESTATUS[0]}"
          sudo chown -R "$USER":"$USER" artifacts/qa || true
          if [ "$status" -ne 0 ]; then
            escaped="$(tail -n 60 "$RUNNER_TEMP/arch-app-qa.log" | tr '\r\n' '  ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error file=arch-app-qa.log,line=1,title=Arch application QA failure::$escaped"
          fi
          exit "$status"
      - name: Require complete application and game evidence
        run: |
          set -euo pipefail
          grep -Fq "ARCH_APP_QA_SOURCE_COMMIT=$SOURCE_SHA" "$RUNNER_TEMP/arch-app-qa.log"
          grep -Fq 'ARCH_APP_QA_STATUS_0' "$RUNNER_TEMP/arch-app-qa.log"
          grep -Fq 'BROWSER_CHROMIUM_STATUS_0' "$RUNNER_TEMP/arch-app-qa.log"
          grep -Fq 'BROWSER_FIREFOX_STATUS_0' "$RUNNER_TEMP/arch-app-qa.log"
          grep -Fq 'game_audio_bytes=' "$RUNNER_TEMP/arch-app-qa.log"
          test "$(find artifacts/qa/app-matrix -maxdepth 1 -name '*.png' | wc -l)" -ge 7
          test -s artifacts/qa/app-matrix/evidence-manifest.txt
          grep -Fq "source_commit=$SOURCE_SHA" artifacts/qa/app-matrix/evidence-manifest.txt
      - name: Upload Arch application/browser/game evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopos-arch-app-matrix-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/qa/app-matrix/
            ${{ runner.temp }}/arch-app-qa.log

  x11-atspi-acceptance:
    name: AT-SPI named surfaces and focus acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run isolated AT-SPI acceptance
        run: |
          set +e
          set -o pipefail
          sudo -E env "PATH=$PATH" bash scripts/run-atspi-qa.sh 2>&1 | tee "$RUNNER_TEMP/atspi.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            escaped="$(tail -n 40 "$RUNNER_TEMP/atspi.log" | tr '\r\n' '  ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error file=atspi.log,line=1,title=AT-SPI acceptance failure::$escaped"
          fi
          exit "$status"
      - name: Upload AT-SPI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-default-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/atspi.log
            /tmp/slopos-atspi-*.log

  x11-atspi-locales:
    name: AT-SPI translated-locale matrix (${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [fr_FR.UTF-8, de_DE.UTF-8]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run AT-SPI acceptance in ${{ matrix.locale }}
        run: |
          set +e
          set -o pipefail
          sudo -E env "PATH=$PATH" SLOPOS_ATSPI_LOCALE="${{ matrix.locale }}" bash scripts/run-atspi-qa.sh 2>&1 | tee "$RUNNER_TEMP/atspi-${{ matrix.locale }}.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            escaped="$(tail -n 40 "$RUNNER_TEMP/atspi-${{ matrix.locale }}.log" | tr '\r\n' '  ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error file=atspi-${{ matrix.locale }}.log,line=1,title=AT-SPI ${{ matrix.locale }} acceptance failure::$escaped"
          fi
          exit "$status"
      - name: Upload translated AT-SPI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atspi-${{ matrix.locale }}-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/atspi-${{ matrix.locale }}.log
            /tmp/slopos-atspi-*.log

  x11-screen-reader:
    name: Orca screen-reader acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Orca-backed AT-SPI acceptance
        run: |
          set +e
          set -o pipefail
          sudo -E env "PATH=$PATH" SLOPOS_ATSPI_SCREEN_READER=1 bash scripts/run-atspi-qa.sh 2>&1 | tee "$RUNNER_TEMP/orca.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            escaped="$(tail -n 40 "$RUNNER_TEMP/orca.log" | tr '\r\n' '  ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error file=orca.log,line=1,title=Orca acceptance failure::$escaped"
          fi
          exit "$status"
      - name: Upload Orca diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orca-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/orca.log
            /tmp/slopos-atspi-*.log

  x11-settings-services:
    name: Settings delegation and unavailable-state acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run Settings service-boundary acceptance
        run: |
          set +e
          set -o pipefail
          sudo -E env "PATH=$PATH" bash scripts/run-settings-service-qa.sh 2>&1 | tee "$RUNNER_TEMP/settings-services.log"
          status="${PIPESTATUS[0]}"
          if [ "$status" -ne 0 ]; then
            escaped="$(tail -n 40 "$RUNNER_TEMP/settings-services.log" | tr '\r\n' '  ' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')"
            echo "::error file=settings-services.log,line=1,title=Settings service acceptance failure::$escaped"
          fi
          exit "$status"
      - name: Upload Settings diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: settings-services-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            ${{ runner.temp }}/settings-services.log
            /tmp/slopos-settings-*.log

  x11-performance:
    name: bounded X11 long-run benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install X11/GTK build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev xvfb openbox xdotool x11-utils dbus-x11 \
            fonts-liberation adwaita-icon-theme
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Hold the X11 session and check RSS/window stability
        run: sudo -E env "PATH=$PATH" SLOPOS_BENCHMARK_HOLD_SECONDS=30 bash scripts/benchmark-x11-session.sh

  x11-resolution-matrix:
    name: X11 geometry QA (${{ matrix.screen }} scale=${{ matrix.scale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - screen: 3440x1440
            scale: 1
          - screen: 3840x2160
            scale: 1
          - screen: 5120x2880
            scale: 1
          - screen: 7680x4320
            scale: 1
          - screen: 2560x1600
            scale: 2
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install retained-resolution X11 dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev xvfb openbox xdotool scrot imagemagick \
            dbus-x11 x11-utils x11-xserver-utils librsvg2-common \
            fonts-liberation fonts-dejavu-core adwaita-icon-theme
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release --locked
      - name: Run retained-resolution geometry QA
        run: >-
          env "PATH=$PATH"
          SLOPOS_QA_SKIP_DEPS=1
          SLOPOS_QA_SKIP_BUILD=1
          SLOPOS_RESOLUTION=${{ matrix.screen }}
          SLOPOS_SCALE=${{ matrix.scale }}
          bash scripts/run-resolution-qa.sh
      - name: Upload resolution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopos-resolution-${{ matrix.screen }}-scale${{ matrix.scale }}-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: artifacts/qa/resolutions/${{ matrix.screen }}-scale${{ matrix.scale }}/

  release-build:
    name: release build (X11 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release --locked
