name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUST_BACKTRACE: 1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lockfile:
    name: lockfile consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate committed lockfile
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- Cargo.lock

  x11-contract:
    name: X11-only product contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Enforce pivot workspace
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/benchmark-x11-session.sh
          test ! -d crates/slopos-compositor
          ! grep -Eq 'slopos-compositor|smithay|wayland-client|wayland-server' Cargo.toml
          grep -Fq 'crates/slopos-session' Cargo.toml
          grep -Fq 'crates/slopos-shell' Cargo.toml
          grep -Fq 'crates/slopos-catalogue' Cargo.toml
          grep -Fq 'crates/slopos-settings' Cargo.toml
          shipping_files=(
            install.sh
            scripts/start-slopos-i
            scripts/install-session-files.sh
            packaging/slopos-i.desktop
            packaging/arch/PKGBUILD
            packaging/debian/changelog
            packaging/debian/control
            packaging/debian/rules
            packaging/iso/build-iso.sh
            packaging/iso/packages.x86_64
            packaging/deps/arch.txt
            packaging/deps/ubuntu.txt
            packaging/deps/arch-build.txt
            packaging/deps/ubuntu-build.txt
            packaging/vm/arch-install.sh
          )
          for path in "${shipping_files[@]}"; do
            test -f "$path"
            ! grep -Eiq '(^|[^[:alnum:]])(wayland|smithay|wlroots|xwayland|slopos-compositor)([^[:alnum:]]|$)' "$path"
          done
          for path in install.sh packaging/arch/PKGBUILD packaging/debian/rules packaging/iso/build-iso.sh; do
            for binary in slopos-session slopos-shell slopos-catalogue slopos-settings; do
              grep -Fq "$binary" "$path"
            done
          done
          grep -Fq 'assets/slopos-logo.png' install.sh
          for path in packaging/arch/PKGBUILD packaging/debian/rules packaging/iso/build-iso.sh; do
            grep -Fq 'share/xsessions/slopos-i.desktop' "$path"
            grep -Fq 'assets/config/openbox/rc.xml' "$path"
            grep -Fq 'themes/slopos-openbox/openbox-3/themerc' "$path"
            grep -Fq 'assets/config/gtk-3.0/gtk.css' "$path"
            grep -Fq 'assets/slopos-logo.png' "$path"
          done
          grep -Fq 'assets/config/mimeapps.list' packaging/iso/build-iso.sh

  format-evidence:
    name: rustfmt remediation evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Generate canonical rustfmt patch
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --binary -- '*.rs' > "$RUNNER_TEMP/rustfmt.patch"
          if [ -s "$RUNNER_TEMP/rustfmt.patch" ]; then
            cat "$RUNNER_TEMP/rustfmt.patch"
          else
            echo "Repository is already rustfmt-clean." > "$RUNNER_TEMP/rustfmt.patch"
          fi
      - name: Upload rustfmt evidence
        uses: actions/upload-artifact@v4
        with:
          name: rustfmt-${{ env.SOURCE_SHA }}
          retention-days: 2
          path: ${{ runner.temp }}/rustfmt.patch

  linux:
    name: build + test + lint (X11 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install X11/GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libx11-dev libxrandr-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustfmt
        run: cargo fmt --all --check

  x11-runtime-smoke:
    name: Xvfb + Openbox behavior and visual smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install runtime/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev xvfb openbox xdotool wmctrl \
            adwaita-icon-theme dbus-x11 x11-utils x11-xserver-utils scrot \
            librsvg2-common fonts-liberation fonts-dejavu-core
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug binaries
        run: cargo build --workspace --locked
      - name: Install Openbox theme for smoke session
        run: |
          mkdir -p "$HOME/.themes/slopos-openbox/openbox-3"
          cp themes/slopos-openbox/openbox-3/themerc "$HOME/.themes/slopos-openbox/openbox-3/themerc"
      - name: Run X11 behavior and screenshot smoke
        id: runtime-smoke
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/slopos-runtime"
          export SLOPOS_OPENBOX_CONFIG="$GITHUB_WORKSPACE/assets/config/openbox/rc.xml"
          export SLOPOS_QA_NO_WELCOME=1
          mkdir -p "$XDG_RUNTIME_DIR" "$RUNNER_TEMP/slopos-qa"
          chmod 700 "$XDG_RUNTIME_DIR"

          cleanup() {
            set +e
            for pid in "${SETTINGS_PID:-}" "${CATALOGUE_PID:-}"; do
              if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
            done
            for pid in "${SETTINGS_PID:-}" "${CATALOGUE_PID:-}"; do
              if [ -n "$pid" ]; then wait "$pid" 2>/dev/null || true; fi
            done
            if [ -n "${SESSION_PID:-}" ]; then
              kill -TERM "$SESSION_PID" 2>/dev/null || true
              wait "$SESSION_PID" 2>/dev/null || true
            fi
            pkill -TERM -x slopos-shell 2>/dev/null || true
            pkill -TERM -x openbox 2>/dev/null || true
            if [ -n "${XVFB_PID:-}" ]; then
              kill -TERM "$XVFB_PID" 2>/dev/null || true
              wait "$XVFB_PID" 2>/dev/null || true
            fi
          }

          diagnostics() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "===== process table ====="
              ps -ef | grep -E 'Xvfb|openbox|slopos' || true
              echo "===== session log ====="
              cat "$RUNNER_TEMP/slopos-session.log" 2>/dev/null || true
              echo "===== settings log ====="
              cat "$RUNNER_TEMP/slopos-settings.log" 2>/dev/null || true
              echo "===== catalogue log ====="
              cat "$RUNNER_TEMP/slopos-catalogue.log" 2>/dev/null || true
              echo "===== xvfb log ====="
              cat "$RUNNER_TEMP/xvfb.log" 2>/dev/null || true
              echo "===== windows ====="
              wmctrl -l 2>/dev/null || true
              xwininfo -root -tree 2>/dev/null || true
            fi
            cleanup
            exit "$status"
          }
          trap diagnostics EXIT

          wait_for() {
            description=$1
            shift
            for _ in $(seq 1 60); do
              if "$@" >/dev/null 2>&1; then
                echo "ready: $description"
                return 0
              fi
              sleep 0.25
            done
            echo "timed out: $description" >&2
            return 1
          }

          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          wait_for "X server" xdpyinfo -display :99

          dbus-run-session -- ./target/debug/slopos-session >"$RUNNER_TEMP/slopos-session.log" 2>&1 &
          SESSION_PID=$!
          wait_for "Openbox" pgrep -x openbox
          wait_for "SLOPOS shell" pgrep -x slopos-shell
          wait_for "top bar" xdotool search --onlyvisible --name '^SLOPOS Top Bar$'
          wait_for "application strip" xdotool search --onlyvisible --name '^SLOPOS Application Strip$'
          scrot "$RUNNER_TEMP/slopos-qa/01-desktop.png"

          shell_count_before=$(pgrep -x slopos-shell | wc -l)
          pkill -USR1 -x slopos-shell
          wait_for "Search palette" xdotool search --onlyvisible --name '^SLOPOS Search$'
          shell_count_after=$(pgrep -x slopos-shell | wc -l)
          test "$shell_count_before" -eq 1
          test "$shell_count_after" -eq 1
          scrot "$RUNNER_TEMP/slopos-qa/02-search.png"
          xdotool key Escape

          shell_pid_before=$(pgrep -xo slopos-shell)
          kill "$shell_pid_before"
          shell_pid_after=""
          for _ in $(seq 1 40); do
            shell_pid_after=$(pgrep -xo slopos-shell 2>/dev/null || true)
            if [ -n "$shell_pid_after" ] && [ "$shell_pid_after" != "$shell_pid_before" ]; then break; fi
            sleep 0.25
          done
          test -n "$shell_pid_after"
          test "$shell_pid_after" != "$shell_pid_before"
          xdotool search --onlyvisible --name '^SLOPOS Top Bar$' >/dev/null

          wm_pid_before=$(pgrep -xo openbox)
          kill "$wm_pid_before"
          wm_pid_after=""
          for _ in $(seq 1 40); do
            wm_pid_after=$(pgrep -xo openbox 2>/dev/null || true)
            if [ -n "$wm_pid_after" ] && [ "$wm_pid_after" != "$wm_pid_before" ]; then break; fi
            sleep 0.25
          done
          test -n "$wm_pid_after"
          test "$wm_pid_after" != "$wm_pid_before"
          xdotool search --onlyvisible --name '^SLOPOS Application Strip$' >/dev/null

          ./target/debug/slopos-settings >"$RUNNER_TEMP/slopos-settings.log" 2>&1 &
          SETTINGS_PID=$!
          wait_for "System Settings" xdotool search --onlyvisible --name '^System Settings$'
          scrot "$RUNNER_TEMP/slopos-qa/03-settings.png"
          kill -TERM "$SETTINGS_PID" 2>/dev/null || true
          wait "$SETTINGS_PID" 2>/dev/null || true
          SETTINGS_PID=""

          ./target/debug/slopos-catalogue >"$RUNNER_TEMP/slopos-catalogue.log" 2>&1 &
          CATALOGUE_PID=$!
          wait_for "Software Catalogue" xdotool search --onlyvisible --name '^Software Catalogue$'
          scrot "$RUNNER_TEMP/slopos-qa/04-catalogue.png"
          kill -TERM "$CATALOGUE_PID" 2>/dev/null || true
          wait "$CATALOGUE_PID" 2>/dev/null || true
          CATALOGUE_PID=""

          for image in "$RUNNER_TEMP"/slopos-qa/*.png; do
            test -s "$image"
          done
          if grep -q 'falling back to host GTK theme' "$RUNNER_TEMP/slopos-session.log"; then
            echo "SLOPOS GTK theme did not load" >&2
            exit 1
          fi

          trap - EXIT
          cleanup
      - name: Upload runtime visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slopos-x11-runtime-${{ env.SOURCE_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/slopos-qa/*.png
            ${{ runner.temp }}/slopos-session.log
            ${{ runner.temp }}/slopos-settings.log
            ${{ runner.temp }}/slopos-catalogue.log
            ${{ runner.temp }}/xvfb.log

  release-build:
    name: release build (X11 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release --locked
