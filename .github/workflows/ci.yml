name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUST_BACKTRACE: 1
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  lockfile:
    name: lockfile consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate committed lockfile
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- Cargo.lock

  x11-contract:
    name: X11-only product contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Enforce pivot workspace
        shell: bash
        run: |
          set -euo pipefail
          test ! -d crates/slopos-compositor
          ! grep -Eq 'slopos-compositor|smithay|wayland-client|wayland-server' Cargo.toml
          grep -Fq 'crates/slopos-session' Cargo.toml
          grep -Fq 'crates/slopos-shell' Cargo.toml
          grep -Fq 'crates/slopos-catalogue' Cargo.toml
          grep -Fq 'crates/slopos-settings' Cargo.toml
          ! grep -Eq 'share/wayland-sessions|slopos-compositor' install.sh

  linux:
    name: build + test + lint (X11 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Install X11/GTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libx11-dev libxrandr-dev libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace --all-targets --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: rustfmt
        run: cargo fmt --all --check

  x11-runtime-smoke:
    name: Xvfb + Openbox session smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Install runtime/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev xvfb openbox xdotool wmctrl \
            adwaita-icon-theme dbus-x11
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build debug binaries
        run: cargo build --workspace --locked
      - name: Install Openbox theme for smoke session
        run: |
          mkdir -p "$HOME/.themes/slopos-openbox/openbox-3"
          cp themes/slopos-openbox/openbox-3/themerc "$HOME/.themes/slopos-openbox/openbox-3/themerc"
      - name: Run X11 session smoke test
        shell: bash
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/slopos-runtime"
          export SLOPOS_OPENBOX_CONFIG="$GITHUB_WORKSPACE/assets/config/openbox/rc.xml"
          export SLOPOS_QA_NO_WELCOME=1
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          cleanup() {
            set +e
            kill "${SESSION_PID:-}" "${XVFB_PID:-}" 2>/dev/null || true
          }
          trap cleanup EXIT

          Xvfb :99 -screen 0 1280x800x24 >"$RUNNER_TEMP/xvfb.log" 2>&1 &
          XVFB_PID=$!
          sleep 2
          ./target/debug/slopos-session >"$RUNNER_TEMP/slopos-session.log" 2>&1 &
          SESSION_PID=$!

          for _ in $(seq 1 20); do
            if pgrep -x openbox >/dev/null && pgrep -x slopos-shell >/dev/null; then
              break
            fi
            sleep 1
          done

          pgrep -x openbox >/dev/null
          pgrep -x slopos-shell >/dev/null
          xdotool search --name "SLOPOS Top Bar" >/dev/null
          xdotool search --name "SLOPOS Application Strip" >/dev/null

  release-build:
    name: release build (X11 Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binaries
        run: cargo build --workspace --release --locked
