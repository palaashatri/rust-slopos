name: CI

# One job, one build: format, lint, unit tests, the Python architecture checks
# and a short real-session smoke test. The long graphical QA suite runs nightly
# (qa.yml); packages are built nightly (nightly.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: build, lint, test and session smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev \
            libssl-dev libdbus-1-dev \
            xvfb openbox xdotool dbus-x11 x11-utils x11-xserver-utils \
            imagemagick fonts-liberation fonts-dejavu-core adwaita-icon-theme
      - name: Select the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Lockfile is up to date
        run: cargo metadata --locked --format-version 1 --no-deps > /dev/null
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked
      - name: Architecture and spec checks
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/qa-venv"
          "$RUNNER_TEMP/qa-venv/bin/pip" install --quiet --requirement qa/requirements-architecture.txt
          "$RUNNER_TEMP/qa-venv/bin/python" -m pytest -q \
            scripts/test_check_architecture.py scripts/test_classic_source_mapping.py
          python3 scripts/check-architecture.py
          python3 scripts/check-classic-source-mapping.py
      - name: Shell scripts parse
        run: |
          set -euo pipefail
          for script in scripts/*.sh scripts/start-slopos-i scripts/slopos-appearance \
                        scripts/slopos-wallpaper install.sh packaging/iso/*.sh packaging/vm/*.sh; do
            bash -n "$script"
          done
      - name: Real session smoke test (Xvfb + Openbox)
        run: |
          cargo build --workspace --locked
          bash scripts/smoke-session.sh "$RUNNER_TEMP/smoke"
      - name: Upload smoke screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-smoke
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 7
