name: Canonicalize Rust formatting

on:
  push:
    branches: [pivot]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pivot
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'style: apply canonical rustfmt'
          git push origin HEAD:pivot
