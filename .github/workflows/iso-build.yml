name: Live Image Build & Release Artifacts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/iso-build.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'packaging/iso/**'
      - 'packaging/slopos-i.desktop'
      - 'packaging/slopos-browser.desktop'
      - 'scripts/start-slopos-i'
      - 'scripts/start-slopos-browser'
      - 'scripts/slopos-appearance'
      - 'scripts/slopos-recovery.sh'
      - 'assets/**'
      - 'themes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-arch-iso:
    name: Arch Linux x86_64 Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Build Arch Live ISO in container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/iso
          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:base-devel \
            bash -lc '
              set -euo pipefail
              echo "DisableSandbox" >> /etc/pacman.conf
              pacman -Syu --noconfirm --needed \
                archiso git rust pkgconf gtk3 gdk-pixbuf2 libx11 libxrandr openssl dbus rsync systemd
              git config --global --add safe.directory /workspace
              OUT_DIR=/workspace/artifacts/iso \
                WORK_DIR=/tmp/slopos-archiso-work \
                bash /workspace/packaging/iso/build-iso.sh
            '
          sudo chown -R "$USER:$USER" artifacts/iso || true
          mapfile -t images < <(find artifacts/iso -maxdepth 1 -type f -name '*.iso' -size +100M -print)
          test "${#images[@]}" -ge 1
          sha256sum "${images[@]}" > artifacts/iso/ARCH-SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > artifacts/iso/arch-source-commit

      - name: Upload Arch ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: slopos-arch-x86_64-iso-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/iso/*.iso
            artifacts/iso/ARCH-SHA256SUMS
            artifacts/iso/arch-source-commit

  build-debian-iso:
    name: Debian x86_64 Live ISO
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Confirm exact source revision
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Install ISO build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            live-build debootstrap xorriso isolinux syslinux-common \
            build-essential pkg-config libgtk-3-dev libx11-dev libxrandr-dev libssl-dev libdbus-1-dev

      - name: Build Debian Live ISO
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="$GITHUB_WORKSPACE/artifacts/iso" \
            WORK_DIR="$RUNNER_TEMP/slopos-debian-live-work" \
            sudo -E bash packaging/iso/build-debian-iso.sh
          test -s artifacts/iso/slopos-i-debian-live-amd64.iso
          test -s artifacts/iso/slopos-i-debian-live-amd64.iso.sha256
          sha256sum --check artifacts/iso/slopos-i-debian-live-amd64.iso.sha256
          printf '%s\n' "$GITHUB_SHA" > artifacts/iso/debian-source-commit

      - name: Upload Debian ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: slopos-debian-x86_64-iso-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/iso/slopos-i-debian-live-amd64.iso
            artifacts/iso/slopos-i-debian-live-amd64.iso.sha256
            artifacts/iso/debian-source-commit
