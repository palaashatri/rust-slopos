[workspace]
resolver = "2"
members = [
    "crates/slopos-session",
    "crates/slopos-shell",
    "crates/slopos-catalogue",
    "crates/slopos-settings",
]

[workspace.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.20"
gio = "0.18"
gdk-pixbuf = "0.18"
pango = "0.18"
x11rb = { version = "0.13", features = ["all-extensions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
zbus = "4.0"
tracing = "0.1"
tracing-subscriber = "0.3"
image = "0.25"
futures = "0.3"
libc = "0.2"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }
walkdir = "2"
