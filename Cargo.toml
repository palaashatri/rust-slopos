[workspace]
resolver = "2"
members = [
    "crates/slopos-render",
    "crates/slopos-kit",
    "crates/slopos-shell",
    "crates/slopos-bus",
    "crates/slopos-sdk",
    "crates/slopos-compositor",
    "crates/slopos-session",
    "crates/slopos-fonts",
    "crates/slopos-vision",
    "crates/slopos-vision-protocol",
    "crates/slopos-vision-client",
    "crates/slopos-visiond",
    "apps/finder",
    "apps/settings",
    "apps/textedit",
    "apps/terminal",
    "apps/appstore",
    "apps/preview",
]

[workspace.dependencies]
wgpu = "22.0"
cosmic-text = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
wayland-client = "0.31"
wayland-protocols = "0.32"
zbus = "4.0"
tracing = "0.1"
tracing-subscriber = "0.3"
image = "0.25"
futures = "0.3"
libc = "0.2"
parking_lot = "0.12"
bytemuck = { version = "1", features = ["derive"] }
bitflags = "2"
uuid = { version = "1", features = ["v4"] }
rten = "0.24"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
