[package]
name = "slopos-files"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SLOPOS Files: native file manager on the SLOPOS UI toolkit"

[dependencies]
slopos-ui = { path = "../../crates/slopos-ui" }
slopos-core = { path = "../../crates/slopos-core" }
accesskit = { workspace = true }
env_logger = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
# Archives (Compress / Extract Here), pure Rust: MIT or MIT/Apache-2.0.
flate2 = "1"
tar = { version = "0.4", default-features = false }
zip = { version = "2", default-features = false, features = ["deflate"] }
lzma-rs = "0.3"
ruzstd = "0.7"

[dev-dependencies]
tempfile = { workspace = true }
