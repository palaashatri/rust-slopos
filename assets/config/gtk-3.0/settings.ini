[Settings]
gtk-theme-name = slopos-gtk
gtk-icon-theme-name = SLOPOS-Platinum
gtk-cursor-theme-name = DMZ-White
gtk-font-name = Liberation Sans 9
gtk-application-prefer-dark-theme = 0
# SLOPOS renders GtkApplication menubar models in the desktop top bar. GTK
# will therefore suppress its own local GtkApplicationWindow menubar while
# keeping the application-menu model available for export.
gtk-shell-shows-menubar = 1
gtk-shell-shows-app-menu = 0
gtk-button-images = 1
gtk-menu-images = 1
gtk-enable-event-sounds = 1
gtk-enable-input-feedback-sounds = 1
gtk-xft-antialias = 1
gtk-xft-hinting = 1
gtk-xft-hintstyle = hintslight
gtk-xft-rgba = rgb
