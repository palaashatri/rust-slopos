[package]
name = "slopos-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SLOPOS-owned UI toolkit: rendering, text, widgets and the X11 window host"

[dependencies]
thiserror.workspace = true
tiny-skia.workspace = true
cosmic-text.workspace = true
resvg.workspace = true
x11rb.workspace = true
log.workspace = true
libc.workspace = true
accesskit.workspace = true
accesskit_unix = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[features]
default = ["atspi", "global-menu"]
# Expose widgets to screen readers over AT-SPI.
atspi = ["dep:accesskit_unix"]
# Export app menus to the desktop's global menu bar over D-Bus.
global-menu = ["dep:zbus"]
