[package]
name = "slopos-ui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SLOPOS-owned UI toolkit: rendering, text, widgets and the X11 window host"

[dependencies]
thiserror.workspace = true
tiny-skia.workspace = true
cosmic-text.workspace = true
resvg.workspace = true
x11rb.workspace = true
log.workspace = true
libc.workspace = true
accesskit.workspace = true
accesskit_unix = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }
# Phase B GPU backend. Pinned exactly; enabled only by the `gpu` feature. Only
# the Vulkan and GLES backends are kept (no DX12, Metal or WebGPU), so the
# default build never sees wgpu.
wgpu = { version = "=30.0.2", optional = true, default-features = false, features = ["std", "wgsl", "vulkan", "gles"] }
futures = { workspace = true, optional = true }

[features]
default = ["atspi", "global-menu", "ibus"]
# Expose widgets to screen readers over AT-SPI.
atspi = ["dep:accesskit_unix"]
# Export app menus to the desktop's global menu bar over D-Bus.
global-menu = ["dep:zbus"]
# Compose text through the IBus input method over D-Bus (platform::ibus).
# Without it the window reports the input method as unavailable.
ibus = ["dep:zbus"]
# wgpu executor for draw lists (crates/slopos-ui/src/render/gpu.rs). Off by
# default: the default build does not compile or link wgpu.
gpu = ["dep:wgpu", "dep:futures"]
