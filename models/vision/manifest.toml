# SLOPOS Vision model manifest.
#
# Describes every model (and model-support) file the vision subsystem can
# load. A file is only loaded after it has been verified against the SHA-256
# and size recorded here. Weights are supplied by an explicit model pack
# or local development import; runtime auto-download is forbidden. The
# model-pack installer/import flow is not implemented in the audited snapshot.
#
# input_shape uses -1 for dynamic dimensions.
#
# Normalization semantics (PaddleOCR training pipelines, applied in code):
#   * ppocr-text-det:  BGR input, x/255 then per-channel ImageNet mean/std.
#   * ppocr-text-rec:  BGR input, (x - 127.5) / 127.5  ==  x/127.5 - 1.
#   * u2netp:          RGB input, divided by max(pixel, 1e-6) then ImageNet
#                      mean/std (rembg semantics).

[[models]]
id = "ppocr-text-det"
version = "PP-OCRv4"
purpose = "text_detection"
architecture = "DBNet"
file = "ch_PP-OCRv4_det_infer.onnx"
sha256 = "d2a7720d45a54257208b1e13e36a8479894cb74155a5efe29462512d42f49da9"
size = 4745517
input_shape = [-1, 3, -1, -1]
normalization = { scale = 255.0, mean = [0.485, 0.456, 0.406], std = [0.229, 0.224, 0.225] }
output_interpretation = "probability map (prob > 0.3)"
source_url = "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv4/"
model_license = "Apache-2.0"
weight_license = "Apache-2.0"
attribution = "PaddleOCR / PP-OCRv4 by PaddlePaddle (Baidu); redistributed via SWHL/RapidOCR"
redistribution = "allowed"

