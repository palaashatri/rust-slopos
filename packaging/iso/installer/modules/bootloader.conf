---
# GRUB for both firmware types: grub-install --target=x86_64-efi on UEFI, and
# --target=i386-pc on BIOS (amd64). The live image ships unsigned GRUB modules
# only, so an installed system will not boot with Secure Boot enforced.
efiBootLoader: "grub"
efiBootloaderId: "slopos"
installEFIFallback: true
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
