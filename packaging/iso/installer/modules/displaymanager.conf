---
# Runs after users. It sets up LightDM for the installed system. Automatic
# login follows the users page: when the user ticks it, the users module sets
# autoLoginUser and this module writes autologin-user; otherwise the
# autologin line stays commented out and LightDM asks for the password.
displaymanagers:
  - lightdm
basicSetup: false
sysconfigSetup: false
lightdm:
  preferred_greeters: ["lightdm-gtk-greeter.desktop"]
