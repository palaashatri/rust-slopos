---
# Erase-disk is the only layout this pass supports. It is selected by default,
# and the summary page asks for confirmation before anything is written.
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

# Hides the manual partitioning button. Replace and Alongside still appear on
# disks that have suitable partitions; this key cannot hide them.
allowManualPartitioning: false

initialPartitioningChoice: erase
initialSwapChoice: none
userSwapChoices:
    - none
defaultFileSystemType:  "ext4"
availableFileSystemTypes: [ "ext4" ]
luksGeneration: luks1
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
