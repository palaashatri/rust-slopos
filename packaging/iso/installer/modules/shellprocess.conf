---
# Runs inside the installed system after users and before initramfs. It strips
# what only the live session needs (casper, the installer launchers and the
# passwordless polkit rule), so the initramfs job builds a clean initrd.
# The script lives in the live root (see live-installer.sh).
dontChroot: false
script:
    - "/usr/libexec/slopos-install/strip-live-system.sh"
