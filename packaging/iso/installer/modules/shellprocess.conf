---
# Runs inside the installed system after users and before initramfs. It strips
# what only the live session needs (casper, the installer launchers and the
# passwordless polkit rule), so the initramfs job builds a clean initrd.
# The NVIDIA step runs after the strip and before the initramfs job, so the
# initrd includes the driver's modules. It installs the proprietary driver
# only when an NVIDIA GPU is present (the package is named in
# nvidia/driver.conf). If apt cannot install that package, the install fails.
# The scripts live in the live root (see live-installer.sh).
dontChroot: false
script:
    - "/usr/libexec/slopos-install/strip-live-system.sh"
    - "/usr/libexec/slopos-nvidia/install-nvidia-driver.sh"
