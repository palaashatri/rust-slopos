---
# The installed user gets sudo through the sudo group, which Ubuntu's sudoers
# already grants. Root gets no password. Automatic login is offered on the
# users page and is off by default; displaymanager.conf applies the choice.
defaultGroups:
    - adm
    - cdrom
    - sudo
    - dip
    - plugdev
    - video
    - audio
sudoersGroup:    sudo
autologinGroup:  autologin
sudoersConfigureWithGroup: false
setRootPassword: false
doReusePassword: false
doAutologin:     false
passwordRequirements:
    minLength: 8
    maxLength: -1
    libpwquality:
        - minlen=8
        - minclass=2
allowWeakPasswords: false
allowWeakPasswordsDefault: false
user:
  shell: /bin/bash
  forbidden_names: [ root ]
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "slopos"
  forbidden_names: [ localhost ]
presets:
    fullName:
        editable: true
    loginName:
        editable: true
