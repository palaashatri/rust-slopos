---
# No external links on the welcome page: the live image is offline-first.
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false
requirements:
    # GiB. Ubuntu minbase plus the SLOPOS payload; re-measure from a built
    # filesystem.size before release.
    requiredStorage:    15.0
    requiredRam:        2.0
    check:
        - storage
        - ram
        - root
    required:
        - storage
        - root
geoip:
    style:    "none"
