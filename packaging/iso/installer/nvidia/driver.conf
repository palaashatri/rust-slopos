# driver.conf — the proprietary NVIDIA driver package for each distribution
# release. Read by install-nvidia-driver.sh; no package name is written in the
# shell logic.
#
# One line per release: <ID> <VERSION_CODENAME> <apt package>
#   ID and VERSION_CODENAME are taken from /etc/os-release on the system.
#   The helper installs the package only when an NVIDIA display controller
#   (PCI vendor 0x10de, class 0x03xx) is present. If no line matches the
#   system, nothing is installed.
#
# Ubuntu 24.04 (noble): the nvidia-driver-<branch> package from the restricted
# component. 570 is the branch named here. It must be confirmed against the
# noble archive before a release; the check in scripts/check-live-installer-config.sh
# only confirms the format, not that the branch exists.
#
# Debian: the nvidia-driver package from the non-free component. The apt
# sources must list non-free first; the helper does not add components.
#
# NVK is an alternative that needs no proprietary driver: Mesa's Vulkan driver
# for nouveau. It uses the mesa Vulkan driver package instead of a line here,
# and its availability on each release is not checked by this file.
#
# Lines starting with # are comments.
ubuntu noble nvidia-driver-570
debian trixie nvidia-driver
debian bookworm nvidia-driver
