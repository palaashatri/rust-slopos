---
# Calamares settings for the SLOPOS-I live installer (Ubuntu 24.04 base).
#
# Module names are stock Calamares 3.3 modules. Options for a module live in
# modules/<name>.conf; modules that need no options take the stock defaults.
# packaging/iso/installer/live-installer.sh copies this file to
# /etc/calamares/settings.conf, modules/ to /etc/calamares/modules/ and
# branding/slopos to /usr/share/calamares/branding/slopos in the live root.
#
# Not configured here (see docs/architecture.md, Installer): Secure Boot
# signing, network install, and partition layouts other than erase-disk.
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - shellprocess
      - initramfs
      - bootloader
      - umount
  - show:
      - finished

branding: slopos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: false
quit-at-end: false
