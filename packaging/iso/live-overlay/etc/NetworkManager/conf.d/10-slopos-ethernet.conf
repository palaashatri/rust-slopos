# SLOPOS live images: NetworkManager must own wired ethernet devices.
#
# Debian and Ubuntu NetworkManager packages default to the ifupdown plugin
# (managed=false), and netplan or /etc/network/interfaces can mark a NIC
# unmanaged. An unmanaged NIC gets no DHCP lease, no default route and no
# uplink for systemd-resolved. The keys below override each of those paths.
# Files in conf.d are read after NetworkManager.conf and win over it.

[keyfile]
unmanaged-devices=none

[ifupdown]
managed=true

[device-slopos-ethernet]
match-device=type:ethernet
managed=true
