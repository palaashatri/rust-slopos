# Portal backend selection for the SLOPOS desktop.
#
# xdg-desktop-portal reads this file as slopos-portals.conf because the session
# sets XDG_CURRENT_DESKTOP=SLOPOS (lower-cased for the file name). It routes
# only the file chooser to the SLOPOS backend, slopos-portal, which serves
# org.freedesktop.impl.portal.desktop.slopos. Other interfaces keep the
# frontend's default choice.
[preferred]
org.freedesktop.impl.portal.FileChooser=slopos;
