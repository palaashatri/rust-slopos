<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768">
  <metadata>
    SLOPOS-I clean-room visual composition reference derived from the user-supplied late-1990s platinum desktop screenshot. This asset intentionally removes third-party logos, product names, proprietary icon artwork, and non-goal UI. It is a composition/style target only; do not copy proprietary assets from the source screenshot.
  </metadata>
  <defs>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a5f8f"/>
      <stop offset="0.48" stop-color="#2f94b9"/>
      <stop offset="1" stop-color="#063969"/>
    </linearGradient>
    <linearGradient id="platinum" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f3f3"/>
      <stop offset="1" stop-color="#c9c9c9"/>
    </linearGradient>
    <pattern id="stripes" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#eeeeee"/>
      <rect y="0" width="4" height="1" fill="#b7b7b7"/>
    </pattern>
    <style>
      .sys { font-family: "Liberation Sans", "DejaVu Sans", sans-serif; fill:#111; }
      .menu { font-size:14px; font-weight:600; }
      .small { font-size:11px; }
      .label { font-size:12px; }
      .title { font-size:12px; font-weight:700; }
      .window { fill:#d7d7d7; stroke:#111; stroke-width:2; }
      .inner { fill:#fff; stroke:#555; stroke-width:1; }
      .bevel-light { stroke:#fff; stroke-width:1; }
      .bevel-dark { stroke:#666; stroke-width:1; }
    </style>
  </defs>

